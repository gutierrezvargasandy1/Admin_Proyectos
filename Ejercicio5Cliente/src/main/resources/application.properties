spring.application.name=Ejercicio5Cliente

# Puerto del frontend. Se usa 8082 porque el 8080 lo ocupa Jenkins (Docker).
server.port=${SERVER_PORT:8082}

# URL base de la API (backend). Configurable por variable de entorno.
api.gestor.url=${API_URL:http://localhost:8081}

# Reduccion de superficie de ataque: el frontend no recibe archivos (multipart desactivado).
spring.servlet.multipart.enabled=false

# Observabilidad: Actuator en un puerto de administracion propio (9082) que no se publica fuera de Docker.
# Prometheus lee /actuator/prometheus; los healthcheck de Docker usan /actuator/health.
management.server.port=${MANAGEMENT_PORT:9082}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
