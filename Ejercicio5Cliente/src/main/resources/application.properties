spring.application.name=Ejercicio5Cliente

# Puerto del frontend. Se usa 8082 porque el 8080 lo ocupa Jenkins (Docker).
server.port=${SERVER_PORT:8082}

# URL base de la API (backend). Configurable por variable de entorno.
api.gestor.url=${API_URL:http://localhost:8081}

# Reduccion de superficie de ataque: el frontend no recibe archivos (multipart desactivado).
spring.servlet.multipart.enabled=false
