spring.application.name=Ejercicio5MyAPIGestor
server.port=${SERVER_PORT:8081}

# Conexion a MariaDB
# Las credenciales NO se guardan en el repositorio: se leen de variables de entorno.
#   DB_URL      (por defecto: MariaDB de Docker publicado en el puerto 3307)
#   DB_USER     (por defecto: usuario de aplicacion "user", no root)
#   DB_PASSWORD (obligatoria, sin valor por defecto)
spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3307/db_cbtis}
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Reduccion de superficie de ataque (mitigacion de CVE de Spring Framework 5.3):
# la API solo responde JSON, no sirve archivos estaticos ni recibe archivos (multipart).
spring.web.resources.add-mappings=false
spring.servlet.multipart.enabled=false
